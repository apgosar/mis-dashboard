<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MIS Report Print</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
  <style>
    /* Print Optimized Reset */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      color: #1a1f36;
      background: #ffffff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* Page Setup */
    .page {
      width: 100%;
      margin: 0;
      padding: 0;
    }
    
    .page-break {
      page-break-before: always;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #2b5797;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .header img { height: 75px; }
    .header-text h1 { margin: 0; font-size: 24px; color: #2b5797; }
    .header-text p { margin: 5px 0 0 0; font-size: 12px; color: #697386; }

    /* Sections */
    .section { margin-bottom: 30px; page-break-inside: avoid; }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #2b5797;
      border-bottom: 1px solid #e3e8ee;
      padding-bottom: 5px;
      margin-bottom: 15px;
    }

    /* KPI Grid */
    .kpi-grid { display: flex; gap: 15px; }
    .kpi-box {
      flex: 1;
      background: #f7fafc;
      border: 1px solid #e3e8ee;
      border-radius: 6px;
      padding: 15px;
    }
    .kpi-label { font-size: 11px; color: #4f566b; text-transform: uppercase; font-weight: 600; }
    .kpi-val { font-size: 20px; font-weight: 700; color: #1a1f36; margin-top: 5px; }

    /* Chart Containers */
    .chart-box {
      width: 100%;
      height: 250px;
      margin-bottom: 20px;
    }
    .chart-box-large {
      height: 350px;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 9px;
      page-break-inside: auto;
    }
    tr { page-break-inside: avoid; page-break-after: auto; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #e3e8ee; }
    th { background: #2b5797; color: white; font-weight: 600; }
    tr:nth-child(even) { background: #f7fafc; }

    #status {
      display: none;
    }
  </style>
</head>
<body>

  <div class="page" id="reportContainer">
    <div class="header">
      <div class="header-logo">
        <img src="/logo.png" alt="VDS Advisory" />
      </div>
      <div class="header-text" style="text-align: right;">
        <h1 id="reportTitle">MIS Report</h1>
        <p id="reportMeta">Generating...</p>
      </div>
    </div>
    
    <div id="content"></div>
  </div>

  <div id="status">Loading</div>
  
  <script src="/report-print.js"></script>
</body>
</html>
